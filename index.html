<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSA Media File Name Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-100:#61B9FF;
    --blue-300:#138AE8;
    --blue-400:#1183DD;
    --blue-500:#0F6CB6;
    --blue-800:#003A63;
    --black:#000000;
    --gray-1300:#231F20;
    --gray-1100:#363636;
    --gray-1000:#636466;
    --gray-800:#979797;
    --gray-600:#D8D8D8;
    --gray-500:#E3E6E6;
    --gray-300:#EFF2F2;
    --gray-200:#F4F7F7;
    --white:#FFFFFF;
    --error:#B3261E;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:32px 16px;
    background:var(--gray-200);
    font-family:'Lato', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--gray-1100);
    display:flex;
    justify-content:center;
  }

  .tool{
    width:100%;
    max-width:620px;
  }

  .tool-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
  }

  .tool-header img{
    height:40px;
    width:auto;
    display:block;
  }

  .tool-header h1{
    font-family:'Oswald', 'Segoe UI Semibold', sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.15;
    color:var(--black);
    margin:0;
  }

  .tool-header p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--gray-1000);
  }

  .card{
    background:var(--white);
    border:1px solid var(--gray-500);
    border-radius:6px;
    padding:24px;
    margin-bottom:16px;
  }

  .field{
    margin-bottom:18px;
  }

  .field:last-child{
    margin-bottom:0;
  }

  .field label{
    display:block;
    font-weight:700;
    font-size:13px;
    color:var(--gray-1300);
    margin-bottom:6px;
  }

  .field .hint{
    font-size:12px;
    color:var(--gray-1000);
    margin-top:5px;
  }

  .field .hint.warn{
    color:var(--error);
  }

  input[type="text"], input[type="date"], select{
    width:100%;
    padding:10px 12px;
    font-family:'Lato', sans-serif;
    font-size:14px;
    color:var(--gray-1300);
    border:1px solid var(--gray-600);
    border-radius:4px;
    background:var(--white);
    outline:none;
    transition:border-color .15s ease;
  }

  input[type="text"]:focus, input[type="date"]:focus, select:focus{
    border-color:var(--blue-400);
    box-shadow:0 0 0 3px rgba(17,131,221,0.15);
  }

  input[disabled]{
    background:var(--gray-300);
    color:var(--gray-800);
  }

  .seg{
    display:flex;
    gap:8px;
  }

  .seg-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }

  @media (max-width:480px){
    .seg-grid{ grid-template-columns:repeat(2, 1fr); }
  }

  .seg button{
    flex:1;
    padding:9px 10px;
    font-family:'Lato', sans-serif;
    font-weight:700;
    font-size:13px;
    border:1px solid var(--gray-600);
    background:var(--white);
    color:var(--gray-1100);
    border-radius:4px;
    cursor:pointer;
    transition:all .15s ease;
  }

  .seg button:hover{
    border-color:var(--blue-300);
  }

  .seg button.active{
    background:var(--blue-400);
    border-color:var(--blue-400);
    color:var(--white);
  }

  .row-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  @media (max-width:480px){
    .row-2{ grid-template-columns:1fr; }
  }

  .preview{
    position:sticky;
    top:16px;
    background:var(--gray-1300);
    border-radius:6px;
    padding:20px 22px;
    color:var(--white);
  }

  .preview .label{
    font-weight:700;
    font-size:12px;
    color:var(--gray-800);
    margin-bottom:8px;
  }

  .preview .name{
    font-family:'Lato', monospace;
    font-size:16px;
    line-height:1.5;
    word-break:break-all;
    color:var(--white);
    min-height:24px;
  }

  .preview .name .seg-missing{
    color:var(--gray-800);
  }

  .preview-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    gap:12px;
  }

  .copy-btn{
    background:var(--blue-400);
    color:var(--white);
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-family:'Lato', sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease;
  }

  .copy-btn:hover{ background:var(--blue-500); }
  .copy-btn:active{ background:var(--blue-800); }

  .copy-btn.copied{ background:#1E8E3E; }

  .status-msg{
    font-size:12px;
    color:var(--gray-800);
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--gray-800);
    margin-top:8px;
  }
</style>
</head>

    <div class="row-2">
      <div class="field">
        <label for="brand">Brand</label>
        <select id="brand">
          <option value="PSA">PSA</option>
          <option value="AdvancedArmament">AdvancedArmament</option>
          <option value="H&amp;R">H&amp;R</option>
          <option value="DPMS">DPMS</option>
        </select>
        <div class="hint">Approved codes only.</div>
      </div>
      <div class="field">
        <label for="item">Product / Event</label>
        <input type="text" id="item" placeholder="e.g. AirMax90" maxlength="40" autocomplete="off">
        <div class="hint">CamelCase or hyphenated, no spaces.</div>
      </div>
    </div>

    <div class="field">
      <label>Content Type</label>
      <div class="seg seg-grid" id="contentTypeSeg">
        <button type="button" data-value="PHOTO" class="active">Photo</button>
        <button type="button" data-value="VIDEO">Video</button>
        <button type="button" data-value="GRAPHIC">Graphic</button>
        <button type="button" data-value="AUDIO">Audio</button>
        <button type="button" data-value="PODCAST">Podcast</button>
        <button type="button" data-value="MOTIONGX">Motion GX</button>
      </div>
    </div>

    <div class="field">
      <label>Stage</label>
      <div class="seg" id="stageSeg">
        <button type="button" data-value="RAW" class="active">Raw</button>
        <button type="button" data-value="DRAFT">Draft</button>
        <button type="button" data-value="FINAL">Final</button>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="dateCaptured">Date Created</label>
        <input type="date" id="dateCaptured">
      </div>
      <div class="field">
        <label for="seqVersion" id="seqVersionLabel">Sequence</label>
        <input type="text" id="seqVersion" placeholder="001" maxlength="10" autocomplete="off">
        <div class="hint" id="seqVersionHint">Raw capture order, e.g. 001, 002…</div>
      </div>
    </div>

    <div class="field">
      <label for="fileExt">File Type</label>
      <select id="fileExt"></select>
    </div>

  </div>

  <footer>Palmetto State Armory &middot; Media Management Tool</footer>

</div>

<script>
(function(){
  var brandEl = document.getElementById('brand');
  var itemEl = document.getElementById('item');
  var dateEl = document.getElementById('dateCaptured');
  var seqEl = document.getElementById('seqVersion');
  var seqLabel = document.getElementById('seqVersionLabel');
  var seqHint = document.getElementById('seqVersionHint');
  var extEl = document.getElementById('fileExt');

  var EXT_MAP = {
    PHOTO:    [['jpg','.jpg'], ['png','.png'], ['tif','.tif'], ['heic','.heic'], ['cr2','.cr2 (Canon RAW)'], ['nef','.nef (Nikon RAW)']],
    VIDEO:    [['mp4','.mp4'], ['mov','.mov'], ['avi','.avi'], ['mxf','.mxf']],
    GRAPHIC:  [['psd','.psd'], ['ai','.ai'], ['eps','.eps'], ['svg','.svg'], ['pdf','.pdf'], ['png','.png'], ['jpg','.jpg']],
    AUDIO:    [['mp3','.mp3'], ['wav','.wav'], ['aiff','.aiff'], ['m4a','.m4a']],
    PODCAST:  [['mp3','.mp3'], ['wav','.wav'], ['m4a','.m4a']],
    MOTIONGX: [['mp4','.mp4'], ['mov','.mov'], ['gif','.gif'], ['webm','.webm']]
  };

  function populateExtOptions(contentTypeVal){
    extEl.innerHTML = '';
    EXT_MAP[contentTypeVal].forEach(function(pair){
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      extEl.appendChild(opt);
    });
  }
  var previewName = document.getElementById('previewName');
  var statusMsg = document.getElementById('statusMsg');
  var copyBtn = document.getElementById('copyBtn');

  var contentType = 'PHOTO';
  var stage = 'RAW';

  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth()+1).padStart(2,'0');
  var dd = String(today.getDate()).padStart(2,'0');
  dateEl.value = yyyy + '-' + mm + '-' + dd;

  function sanitizeToken(value){
    // Strip anything that's not a letter, number, or hyphen. No spaces, no underscores (our separator).
    return value.replace(/[^A-Za-z0-9-]/g, '');
  }

  function wireSeg(containerId, onChange){
    var container = document.getElementById(containerId);
    var buttons = container.querySelectorAll('button');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        buttons.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        onChange(btn.getAttribute('data-value'));
      });
    });
  }

  wireSeg('contentTypeSeg', function(val){
    contentType = val;
    populateExtOptions(val);
    render();
  });

  wireSeg('stageSeg', function(val){
    stage = val;
    updateSeqField();
    render();
  });

  function updateSeqField(){
    if(stage === 'RAW'){
      seqEl.disabled = false;
      seqLabel.textContent = 'Sequence';
      seqEl.placeholder = '001';
      seqHint.textContent = 'Raw capture order, e.g. 001, 002…';
      seqHint.classList.remove('warn');
    } else if(stage === 'DRAFT'){
      seqEl.disabled = false;
      seqLabel.textContent = 'Version';
      seqEl.placeholder = 'V1';
      seqHint.textContent = 'Draft revision, e.g. V1, V2…';
      seqHint.classList.remove('warn');
    } else {
      seqEl.disabled = true;
      seqEl.value = '';
      seqLabel.textContent = 'Sequence / Version';
      seqHint.textContent = 'Not used for Final — approved files don\'t carry a sequence.';
      seqHint.classList.remove('warn');
    }
  }

  function render(){
    var brandRaw = brandEl.value.trim();
    var itemRaw = itemEl.value.trim();
    var brand = sanitizeToken(brandRaw);
    var item = sanitizeToken(itemRaw);
    var seq = sanitizeToken(seqEl.value.trim());
    if(stage === 'DRAFT' && seq){
      seq = 'V' + seq.replace(/^[Vv]/, '');
    }

    var dateVal = dateEl.value;
    var dateFormatted = '';
    if(dateVal){
      dateFormatted = dateVal.replace(/-/g, '');
    }

    var warnings = [];
    if(brandRaw && sanitizeToken(brandRaw) !== brandRaw){
      warnings.push('Brand code "' + brandRaw + '" simplified to "' + brand + '" for the file name (symbols removed)');
    }
    if(itemRaw && sanitizeToken(itemRaw) !== itemRaw){
      warnings.push('Product/Event had spaces/symbols removed');
    }

    var missing = [];
    if(!brand) missing.push('Brand');
    if(!item) missing.push('Product/Event');
    if(!dateFormatted) missing.push('Date');
    if((stage === 'RAW' || stage === 'DRAFT') && !seq) missing.push(stage === 'RAW' ? 'Sequence' : 'Version');

    if(missing.length){
      previewName.innerHTML = '<span class="seg-missing">Fill in: ' + missing.join(', ') + '</span>';
      statusMsg.textContent = warnings.length ? warnings.join(' · ') : 'Fill in the fields below';
      copyBtn.disabled = true;
      copyBtn.style.opacity = 0.5;
      return '';
    }

    var parts = [brand, item, contentType, dateFormatted, stage];
    var nameCore = parts.join('_');
    if(stage !== 'FINAL' && seq){
      nameCore += '_' + seq;
    }
    var fullName = nameCore + '.' + extEl.value;

    previewName.textContent = fullName;
    statusMsg.textContent = warnings.length ? warnings.join(' · ') : 'Ready to copy';
    copyBtn.disabled = false;
    copyBtn.style.opacity = 1;
    return fullName;
  }

  [brandEl, itemEl, dateEl, seqEl, extEl].forEach(function(el){
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  copyBtn.addEventListener('click', function(){
    var name = render();
    if(!name) return;
    navigator.clipboard.writeText(name).then(function(){
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(function(){
        copyBtn.textContent = 'Copy name';
        copyBtn.classList.remove('copied');
      }, 1500);
    }).catch(function(){
      // Fallback for environments without Clipboard API
      var temp = document.createElement('textarea');
      temp.value = name;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
      copyBtn.textContent = 'Copied!';
      setTimeout(function(){ copyBtn.textContent = 'Copy name'; }, 1500);
    });
  });

  populateExtOptions(contentType);
  updateSeqField();
  render();
})();
</script>

</body>
</html>
